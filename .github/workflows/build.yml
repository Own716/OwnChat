name: Build OwnChat APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK and CMake
        run: |
          echo "Installing NDK 27.2.12479018 and CMake 3.22.1..."
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Generate Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore Your_Key.jks \
            -alias Your_Alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass Your_Password \
            -keypass Your_Password \
            -dname "CN=OwnChat, OU=OwnChat, O=OwnChat, L=City, S=State, C=US"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build OwnChat Standalone APK
        run: |
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p release-apks
          find TMessagesProj_AppStandalone/ -name "*.apk" -type f -exec cp {} release-apks/ \;
          echo "Collected APK files:"
          ls -lh release-apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OwnChat-v1.0.0-APKs
          path: release-apks/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.0
          name: OwnChat v1.0.0 正式版
          body: |
            # OwnChat v1.0.0 正式版

            ## 软件介绍
            OwnChat 是一款功能丰富、安全私密、高度可定制的现代化移动即时通讯客户端。

            ## 核心特性
            - **破解受保护内容限制**：允许转发、复制和保存受保护群组/频道的媒体与消息
            - **解除截屏限制**：允许在任何界面（包括阅后即焚、受保护媒体等）自由截屏
            - **隐藏正在输入状态**：发送消息时不向对方展示输入状态
            - **防撤回与已读控制**：保护消息不丢失，支持隐身已读
            - **专属深度定制**：优化底层网络与外观交互体验

            ## 安装包说明
            - `OwnChat-1.0.0-universal.apk`：通用架构，适用于所有 Android 设备（推荐初次安装）
            - `OwnChat-1.0.0-arm64-v8a.apk`：适用于大多数现代 64 位 Android 手机
            - `OwnChat-1.0.0-armeabi-v7a.apk`：适用于 32 位老款 Android 设备
          files: release-apks/*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
